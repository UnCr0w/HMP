<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title> TOKO MAKMUR JAYA </ion-title>

    <ion-buttons slot="end" class="theme-toggle-container">
      <ion-icon name="sunny-outline" class="theme-icon"></ion-icon>
      <ion-toggle
        [(ngModel)]="isDarkMode"
        (ionChange)="changeMode()"
      ></ion-toggle>
      <ion-icon name="moon-outline" class="theme-icon"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-accordion-group expand="inset">
    <ion-item lines="none">
          <ion-label class="ion-text-wrap">
            <strong>Ringkasan</strong>
          </ion-label>
          <ion-button slot="end" fill="clear" (click)="refreshData()">
            Refresh data
          </ion-button>
        </ion-item>

    <ion-accordion>
      <ion-item slot="header" color="light">
        <ion-label>Jumlah produk</ion-label>
      </ion-item>
      <ion-list slot="content">
        <ion-item *ngFor="let product of products">
          <ion-label>{{ product.nama }}</ion-label>
          <ion-label>Stok: {{product.stok}}</ion-label>
        </ion-item>
      </ion-list>
    </ion-accordion>

    <ion-accordion>
      <ion-item slot="header" color="light">
        <ion-label>Total transaksi hari ini</ion-label>
      </ion-item>

      <ion-list slot="content">
        <ion-item *ngFor="let transaction of todayTransaction">
          <ion-label *ngFor="let product of transaction.items">
            Order #{{transaction.id}} <br />
            {{product.nama}} <br />
            Qty: {{product.qty}}
          </ion-label>
          <ion-label> Total: Rp{{transaction.totalHarga}} </ion-label>
        </ion-item>
      </ion-list>
    </ion-accordion>

    <ion-accordion>
      <ion-item slot="header" color="light">
        <ion-label>Produk terlaris</ion-label>
      </ion-item>

      <ion-list slot="content">
        <ion-item *ngFor="let product of topItems">
          <ion-label>
            {{product.id}} - {{product.nama}} <br />
            Qty: {{product.qty}}
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-accordion>
  </ion-accordion-group>
</ion-content>
