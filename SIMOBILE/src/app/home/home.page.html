<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title> TOKO MAKMUR JAYA </ion-title>

    <ion-buttons slot="end" class="theme-toggle-container">
      <ion-icon name="sunny-outline" class="theme-icon"></ion-icon>
      <ion-toggle [(ngModel)]="isDarkMode" (ionChange)="changeMode()"></ion-toggle>
      <ion-icon name="moon-outline" class="theme-icon"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-accordion-group expand="inset">
    <ion-label>Ringkasan</ion-label>
    <ion-accordion>
      <ion-item slot="header" color="light">
        <ion-label>Jumlah produk</ion-label>
      </ion-item>

      <ion-list slot="content">
            <ion-item *ngFor="let product of products">
              <ion-label>{{ product.nama }}</ion-label>
              <ion-label>Qty: {{product.stok}}</ion-label>
            </ion-item>
          </ion-list>
    </ion-accordion>

    <ion-accordion>
      <ion-item slot="header" color="light">
        <ion-label>Total transaksi hari ini</ion-label>
      </ion-item>

      <ion-list slot="content">
            <ion-item *ngFor="let transaction of transactionHistory">

            </ion-item>
          </ion-list>
    </ion-accordion>

    <ion-accordion>
      <ion-item slot="header" color="light">
        <ion-label>Produk terlaris</ion-label>
      </ion-item>

      <ion-list slot="content">
            <ion-item *ngFor="let transaction of transactionHistory">

            </ion-item>
          </ion-list>
    </ion-accordion>
  </ion-accordion-group>

</ion-content>
