<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/produk"></ion-back-button>
    </ion-buttons>
    <ion-title>Keranjang</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Keranjang</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item *ngFor="let item of cartService.buyItems">
      <ion-img [src]="item.url == '' ? 'https://placehold.net/default.png' : item.url"
               [ngStyle]="{'width.px': 80, 'height.px': 80, 'margin-right.px': 16}"></ion-img>
      <ion-label>
        <h2>{{item.nama}}</h2>
        <p>Jumlah: {{item.qty}}</p>
        <p>Harga: Rp{{item.hargaJual}}</p>
        <p>Subtotal: Rp{{item.hargaJual * item.qty}}</p>
      </ion-label>
      <ion-button slot="end" color="danger" fill="clear" (click)="hapus(item.id)">Hapus</ion-button>
    </ion-item>
  </ion-list>

  <p class="ion-text-center" *ngIf="cartService.buyItems.length == 0">Keranjang kosong</p>

  <ion-item *ngIf="cartService.buyItems.length > 0">
    <ion-label><h1>Total</h1></ion-label>
    <ion-label slot="end"><h1>Rp{{cartService.getTotalHarga()}}</h1></ion-label>
  </ion-item>

  <ion-button id="btnTransaksi" expand="block" *ngIf="cartService.buyItems.length > 0" (click)="checkout()">
    Konfirmasi Transaksi
    <ion-alert trigger="btnTransaksi" header="Transaksi"
          message="{{pesan}}" [buttons]="alertButtons" (click)="routerProduk()"></ion-alert>
  </ion-button>
</ion-content>
