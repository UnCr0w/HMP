<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>
      Detail Produk
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">detailproduk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>
        {{new_nama}}
        <ion-chip color="{{badge(new_tipe)}}">
          {{new_tipe}}
        </ion-chip>
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <div id="info">
          <div id="left">
            <ion-item>
              <span>Nama</span>:&nbsp;
              <ion-input [(ngModel)]="new_nama" placeholder="Produk"></ion-input>
            </ion-item>

            <ion-item>
              <span>Harga</span>:&nbsp;
              <ion-input type="number" [(ngModel)]="new_harga" placeholder="0"></ion-input>
            </ion-item>

            <ion-item>
              <span>Stok</span>:&nbsp;
              <ion-input type="number" [(ngModel)]="new_stok" placeholder="0"></ion-input>
            </ion-item>

            <ion-item>
              <span>Tipe</span>:&nbsp;
              <ion-select labelPlacement="stacked" placeholder="Snack" [(ngModel)]="new_tipe">
                <ion-select-option *ngFor="let tipe of arr_tipe" [value]="tipe">{{tipe}}
                </ion-select-option>
              </ion-select>
            </ion-item>

            <ion-item>
              <span>URL</span>:&nbsp;
              <ion-input type="url" labelPlacement="floating" label="URL Foto " [(ngModel)]="new_url"></ion-input>
            </ion-item>
          </div>

          <div id="right">
            <ion-img [src]="new_url == '' ? 'https://placehold.net/default.png' : new_url"></ion-img>
          </div>
        </div>

      </ion-list>
      <ion-item>
        <ion-button id="btnSimpan" (click)="editProduk()">Simpan
          <ion-alert trigger="btnSimpan" header="Edit Produk" message="{{pesan}}" [buttons]="alertButtons"></ion-alert>
        </ion-button>
      </ion-item>
    </ion-card-content>

  </ion-card>
</ion-content>
