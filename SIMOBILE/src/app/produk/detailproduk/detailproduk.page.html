<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/produk"></ion-back-button>
    </ion-buttons>
    <ion-title>
      Detail Produk
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">detailproduk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>
        {{new_nama}}
        <ion-chip color="{{badge(new_kategori)}}">
          {{new_kategori}}
        </ion-chip>
      </ion-card-title>
    </ion-card-header>

    <ion-card-content *ngIf="!isEditting">
      <ion-list>
        <div id="info">
          <div id="left">

            <ion-item>
              <span>Nama</span>: {{new_nama}}
            </ion-item>

            <ion-item>
              <span>Harga Beli</span>: Rp.{{new_hargaBeli}}
            </ion-item>

            <ion-item>
              <span>Harga Jual</span>: Rp.{{new_hargaJual}}
            </ion-item>

            <ion-item>
              <span>Stok</span>: {{new_stok}}
            </ion-item>

            <ion-item>
              <span>kategori</span>: {{new_kategori}}
            </ion-item>

            <ion-item>
              <span>URL</span>:&nbsp;
              <ion-label>{{new_url}}</ion-label>
            </ion-item>

          </div>

          <div id="right">
            <ion-img [src]="new_url == '' ? 'https://placehold.net/default.png' : new_url"></ion-img>
          </div>
        </div>
      </ion-list>

      <ion-item>
        <ion-button (click)="isEditting = true">Edit
        </ion-button>
      </ion-item>

    </ion-card-content>

    <ion-card-content *ngIf="isEditting">
      <ion-list>
        <div id="info">
          <div id="left">

            <ion-item>
              <span>Nama</span>:&nbsp;
              <ion-input [(ngModel)]="new_nama" placeholder="Produk"></ion-input>
            </ion-item>

            <ion-item>
              <span>Harga Beli</span>:&nbsp;
              <ion-input type="number" [(ngModel)]="new_hargaBeli" placeholder="0">
                <!-- <ion-note color="danger" *ngIf="new_hargaBeli == null || new_hargaBeli < 0">
                  Agka tidak valid
                </ion-note> -->
              </ion-input>
            </ion-item>

            <ion-item>
              <span>Harga Jual</span>:&nbsp;
              <ion-input type="number" [(ngModel)]="new_hargaJual" placeholder="0">
                <!-- <ion-note color="danger" *ngIf="new_hargaJual == null || new_hargaJual < 0">
                  Agka tidak valid
                </ion-note> -->
              </ion-input>
            </ion-item>

            <ion-item>
              <span>Stok</span>:&nbsp;
              <ion-input type="number" [(ngModel)]="new_stok" placeholder="0">
                <!-- <ion-note color="danger" *ngIf="new_stock == null || new_stock < 0">
                  Agka tidak valid
                </ion-note> -->
              </ion-input>
            </ion-item>

            <ion-item>
              <span>kategori</span>:&nbsp;
              <ion-select labelPlacement="stacked" placeholder="Snack" [(ngModel)]="new_kategori">
                <ion-select-option *ngFor="let kategori of arr_kategori" [value]="kategori">{{kategori}}
                </ion-select-option>
              </ion-select>
            </ion-item>

            <ion-item>
              <span>URL</span>:&nbsp;
              <ion-input type="url" labelPlacement="floating" label="URL Foto " [(ngModel)]="new_url"></ion-input>
            </ion-item>

          </div>

          <div id="right">
            <ion-img [src]="new_url == '' ? 'https://placehold.net/default.png' : new_url"></ion-img>
          </div>

        </div>
      </ion-list>

      <ion-item>
        <ion-button id="btnSimpan" (click)="editProduk()">Simpan
          <ion-alert trigger="btnSimpan" header="Edit Produk" message="{{pesan}}" [buttons]="alertButtons"></ion-alert>
        </ion-button>
      </ion-item>

    </ion-card-content>

  </ion-card>
</ion-content>
