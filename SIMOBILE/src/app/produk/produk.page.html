<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Produk</ion-title>
    <ion-buttons slot="end">
      <ion-button id="btnKeranajang" (click)="openedKeranjang = true" routerLink="{{routerKeranjang()}}">
        <ion-icon name="cart-outline"></ion-icon>
        <ion-alert *ngIf="problemQty" trigger="btnKeranajang" header="Keranjang" message="{{pesan}}"
          [buttons]="alertButtons" routerLink="keranjang"></ion-alert>
        <ion-badge color="danger">{{totalItem()}}</ion-badge>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="top-container">
    <ion-item id="search-bar">
      <ion-select label="" labelPlacement="stacked" placeholder="Snack" [(ngModel)]="kategori">
        <ion-select-option *ngFor="let kategori of arr_kategori" [value]="kategori">{{kategori}}
        </ion-select-option>
      </ion-select>

      <ion-input labelPlacement="end" placeholder="Cari Produk" [(ngModel)]="keyword">
      </ion-input>
      <ion-icon name="search-outline"></ion-icon>

      <ion-button slot="end" id="btnTambahProduk" routerLink="tambahproduk" [disabled]="totalItem() != 0"
        (click)="openedAddProduct = true; ">
        <!-- Tambah -->
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </div>

  <div id="card-container">

    <ion-card *ngFor="let product of filter(); let i = index" class="card-product">
      <ion-card-header routerLink="{{routerDetail(product)}}">
        <ion-item>
          {{product.nama}}
          <ion-chip color="{{badge(product.kategori)}}">
            {{product.kategori}}
          </ion-chip>
        </ion-item>
      </ion-card-header>

      <ion-card-content routerLink="{{routerDetail(product)}}">
        <ion-img routerLink="{{routerDetail(product)}}"
          [src]="product.url == '' ? 'https://placehold.net/default.png' : product.url"></ion-img>

        <ion-item>
          <span>Harga Beli</span>: Rp.{{product.hargaBeli}}
        </ion-item>
        <ion-item>
          <span>Harga Jual</span>: Rp.{{product.hargaJual}}
        </ion-item>
        <ion-item>
          <span>Stok</span>: {{product.stok}}
        </ion-item>
      </ion-card-content>

      <div>
        <ion-item class="product-btn">
          <ion-button routerLink="detailproduk/{{product.id - 1}}" [disabled]="totalItem() > 0">Lihat Detail</ion-button>
        </ion-item>
        <ion-item *ngIf="this.qty[product.id] == 0" class="product-btn">
          <ion-button (click)="addToCart(product)" [disabled]="product.stok == 0">Add to Cart</ion-button>
        </ion-item>
        <ion-item *ngIf="qty[product.id] == null || qty[product.id] > 0 || qty[product.id] < 0" id="add-qty">
          <ion-button (click)="removeQty(product)" [disabled]="qty[product.id] <= 0"><ion-icon
              name="chevron-back-outline"></ion-icon>
          </ion-button>

          <ion-input type="number" [max]="product.stok" placeholder="Jumlah Qty" [(ngModel)]="qty[product.id]"
            (keyup)="addToCart(product)">
            <ion-note color="danger" *ngIf="qty[product.id] > product.stok">
              Melebihi stok (maks {{product.stok}})
            </ion-note>
            <ion-note color="danger" *ngIf="qty[product.id] < 1">
              Jumlah minimal 1
            </ion-note>
          </ion-input>

          <ion-button (click)="addQty(product)" [disabled]="qty[product.id] >= product.stok"><ion-icon
              name="chevron-forward-outline"></ion-icon></ion-button>
        </ion-item>
      </div>
    </ion-card>
  </div>
</ion-content>
