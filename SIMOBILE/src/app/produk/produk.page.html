<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Produk</ion-title>

    <ion-buttons slot="end">
      <ion-button routerLink="/tambahproduk">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row *ngFor="let product2 of chunkArray(products, 3); let i = index">
      <ion-col *ngFor="let product of product2; let i2 = index">
        <ion-list routerLink="detailproduk/{{i*3 + i2}}">
          <ion-header [ngStyle]="{ 'padding.px' : 10,'padding-left.px': 20,  'font-size.px' : 20}">
            {{product.nama}}
            <ion-chip color="{{setBadge(product.tipe)}}">
              {{product.tipe}}
            </ion-chip>
          </ion-header>
          <ion-img [src]="product.url" [ngStyle]="{ 'margin.px' : 20}"></ion-img>
          <ion-item>
            Harga Beli: Rp{{product.hargaBeli}}
          </ion-item>
          <ion-item>
            Harga Jual: Rp{{product.hargaJual}}
          </ion-item>
          <ion-item>
            Stock: {{product.stok}}
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>




</ion-content>
