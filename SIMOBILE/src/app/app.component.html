<ion-app>
  <ion-split-pane contentId="main-content">

    <!-- LEFT SIDEBAR MENU -->
    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar>
          <ion-title>Menu List</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list lines="full" class="ion-no-padding">
          <ion-menu-toggle auto-hide="false">

            <ion-item button routerLink="/dashboard" routerDirection="root" detail="false">
              <ion-icon slot="start" name="home-outline"></ion-icon>
              <ion-label>Dashboard</ion-label>
            </ion-item>

            <ion-item button routerLink="/produk" routerDirection="root" detail="false">
              <ion-icon slot="start" name="list-outline"></ion-icon>
              <ion-label>Produk</ion-label>
            </ion-item>

            <ion-item button routerLink="/transaksi" routerDirection="root" detail="false">
              <ion-icon slot="start" name="receipt-outline"></ion-icon>
              <ion-label>Transaksi</ion-label>
            </ion-item>

            <ion-item button routerLink="/profile" routerDirection="root" detail="false">
              <ion-icon slot="start" name="person-outline"></ion-icon>
              <ion-label>Profile</ion-label>
            </ion-item>

          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>

    <!-- MAIN RIGHT CONTENT AREA -->
    <div class="ion-page" id="main-content">
      <ion-router-outlet></ion-router-outlet>

      <!-- BOTTOM FOOTER -->
      <ion-footer>
        <ion-tab-bar slot="bottom">

          <ion-tab-button tab="pengaturan" routerLink="/pengaturan">
            <ion-icon name="home"></ion-icon>
            <ion-label>Pengaturan</ion-label>
          </ion-tab-button>

          <ion-tab-button tab="about" routerLink="/about">
            <ion-icon name="help-circle-outline"></ion-icon>
            <ion-label>About</ion-label>
          </ion-tab-button>

          <ion-tab-button (click)="logout()">
            <ion-icon name="log-out-outline"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-tab-button>

        </ion-tab-bar>
      </ion-footer>
    </div>

  </ion-split-pane>
</ion-app>
