<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Riwayat Transaksi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <p class="ion-text-center" *ngIf="transactionService.getHistory().length === 0">
    Belum ada transaksi hari ini.
  </p>

  <ion-card *ngFor="let receipt of transactionService.getHistory()">
    <ion-card-header>
      <ion-card-title>Transaksi #{{ receipt.id }}</ion-card-title>
      <ion-card-subtitle>{{ receipt.tanggal | date:'short' }}</ion-card-subtitle>
    </ion-card-header>
    
    <ion-card-content>
      <p *ngFor="let item of receipt.items">
        {{ item.qty }}x {{ item.nama }}
      </p>
      
      <ion-item lines="none">
        <ion-label><strong>Total:</strong></ion-label>
        <ion-note slot="end" color="success"><strong>Rp{{ receipt.totalHarga }}</strong></ion-note>
      </ion-item>
    </ion-card-content>
  </ion-card>

</ion-content>
