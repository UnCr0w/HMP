<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/produk"></ion-back-button>
    </ion-buttons>
    <ion-title>Detail Riwayat Transaksi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">detailriwayat</ion-title>
    </ion-toolbar>
  </ion-header>


  <ion-list>
    <div id="info">
      <div>
        <ion-item>
          <span>Transaksi</span>:&nbsp;#
          <ion-label>{{riwayat[id].id}}</ion-label>
        </ion-item>
        <ion-item>
          <span>Tanggal </span>:&nbsp;
          <ion-label>{{dateFormatInd(riwayat[id].tanggal)}}</ion-label>
        </ion-item>
        <ion-item>
          <span>Total Harga</span>:&nbsp;
          <ion-label>Rp.{{riwayat[id].totalHarga}}</ion-label>
        </ion-item>
        <ion-item>
          <span>Items</span>
        </ion-item>
      </div>

      <ion-card *ngFor="let item of riwayat[id].items">
        <ion-card class="item-card">
          <div class="left">
            <ion-item>
              <span>Nama</span>:&nbsp;
              <ion-label>{{item.nama}}</ion-label>
            </ion-item>
            <ion-item>
              <span>Jumlah</span>:&nbsp;
              <ion-label>{{item.qty}}</ion-label>
            </ion-item>
            <ion-item>
              <span>Harga Jual</span>:&nbsp;
              <ion-label>{{item.hargaJual}}</ion-label>
            </ion-item>
          </div>
          <div class="right">
            <ion-img [src]="item.url == '' ? 'https://placehold.net/default.png' : item.url"></ion-img>
          </div>
        </ion-card>
      </ion-card>
     
    </div>
  </ion-list>
</ion-content>
